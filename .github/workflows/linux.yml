name: Build linux

on:
    pull_request:
    push:
        branches:
            - main
            - dev
            # The fork's server: the latest upstream release plus the fork's server fixes. Its pushes upload the server.
            - server
            # The fork's test build: upstream main (new protocol) plus the fork's server fixes, for the test server only.
            # Its releases are tagged testbuild-server-<version>, which the VPS updater (server-*) does not install.
            - test-build
    workflow_call:
        inputs:
            build-mode:
                required: false
                type: string
                default: releasedbg
            upload-build-for-next-job:
                required: false
                type: boolean
                default: false

env:
    BUILD_MODE: ${{ inputs.build-mode || 'releasedbg' }}

jobs:
    build:
        strategy:
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      runner: ubuntu-24.04-arm

        runs-on: ${{ matrix.runner }}
        if: "!contains(github.event.head_commit.message, 'ci skip')"

        steps:
            - uses: actions/checkout@v7
              with:
                  # We need full history in order to create a version string (BuildInfo.h)
                  fetch-depth: 0

            - name: Checkout submodules
              run: |
                  git submodule sync --recursive
                  git submodule update --init --force --recursive --depth=1

            # The fork has no release tags (a tag push would publish a release), so the version the server reports
            # (BuildInfo.h, from git describe) would name an old one. The server branch takes upstream's tags first.
            - name: Upstream release tags for the server branch
              if: github.ref == 'refs/heads/server' || github.ref == 'refs/heads/test-build'
              # The server-<version> tags of this branch's own releases would be nearer than any release, so they go.
              run: |
                  git fetch --no-recurse-submodules --tags https://github.com/Dosylia/urSovngarde.git || true
                  git tag -l 'server-*' 'client-*' 'testbuild-*' | xargs -r git tag -d

            - name: Checkout main on tag push
              if: github.ref_type == 'tag'
              run: |
                  test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
                  git checkout -B main HEAD

            - name: Cache xmake dependencies
              uses: actions/cache@v6
              with:
                  path: ~/.xmake/packages
                  key: ${{ matrix.runner }}-xmake-2-${{ hashFiles('**/xmake.lua') }}
                  # The newest earlier cache when an xmake.lua edit changed the key (windows.yml says why).
                  # Raise the number when a recipe changes how a package is built: its build hash stays, so the old build would come back.
                  restore-keys: |
                      ${{ matrix.runner }}-xmake-2-

            # Install xmake
            - name: Setup xmake
              uses: xmake-io/github-action-setup-xmake@v1
              with:
                  xmake-version: 3.1.0
                  actions-cache-folder: ".xmake-cache" # This doesn't cache dependencies, only xmake itself
                  actions-cache-key: ${{ matrix.runner }}

            - name: Configure xmake and install dependencies
              run: xmake config --mode="$BUILD_MODE" --yes -vD

            # Build the server
            - name: Build
              run: xmake -y

            # The encoding round trips and the rest of TPTests
            - name: Run tests
              run: xmake run TPTests

            - name: Stage Linux server
              run: |
                  xmake install -o packaged
                  install -d release-stage
                  install -m 755 packaged/bin/urSovngardeServer release-stage/
                  install -m 644 packaged/lib/libSTServer.so release-stage/

            # If GameNetworkingSockets is compiled against other OpenSSL headers than the library it links, calls such
            # as EVP_DigestSignUpdate (a macro in 1.1.1, a function in 3) stay undefined in libSTServer.so, resolve from
            # the host's libcrypto at run time and abort the server on the first connection. Starting the server does
            # not catch it, so check the library for undefined OpenSSL symbols.
            - name: No undefined OpenSSL symbols in the server library
              run: |
                  undefined="$(readelf -W --dyn-syms release-stage/libSTServer.so | awk '$7 == "UND"' | grep -E ' (EVP_|SSL_|OPENSSL_|CRYPTO_|HMAC|BIO_|ERR_)' || true)"
                  if [ -n "$undefined" ]; then
                    echo "libSTServer.so leaves OpenSSL symbols to the system:"
                    echo "$undefined"
                    exit 1
                  fi

            - name: Verify Linux binary architecture
              run: |
                  file release-stage/urSovngardeServer
                  case "${{ matrix.arch }}" in
                    amd64) file release-stage/urSovngardeServer | grep -Eq 'x86-64|x86_64' ;;
                    arm64) file release-stage/urSovngardeServer | grep -Eqi 'aarch64|arm64' ;;
                  esac

            # The program refuses a library from another build (CheckBuildTag) and exits at once, so a server that
            # starts and listens proves the pair belongs together. Run from a copy: it writes config/ and logs/ where it
            # runs, which must not end up in the archive.
            - name: The staged server starts
              run: |
                  run_dir="$RUNNER_TEMP/server-start"
                  mkdir -p "$run_dir"
                  cp release-stage/urSovngardeServer release-stage/libSTServer.so "$run_dir/"
                  cd "$run_dir"
                  TILTED_ACCEPT_EULA=1 LD_LIBRARY_PATH=. timeout 8 ./urSovngardeServer > start.txt 2>&1 || true
                  cat start.txt
                  grep -q "started on port" start.txt

            # A client's handshake is the first use of the crypto library, so a server that starts can still die here.
            # With no player in the world the bot never ends, so its log is the verdict.
            # The kill fails if the server has died.
            - name: A client joins the staged server
              run: |
                  cd "$RUNNER_TEMP/server-start"
                  TILTED_ACCEPT_EULA=1 LD_LIBRARY_PATH=. ./urSovngardeServer > join.txt 2>&1 &
                  server=$!
                  timeout 10 sh -c 'until grep -q "started on port" join.txt; do sleep 0.2; done'
                  timeout 8 "$GITHUB_WORKSPACE/packaged/bin/STBot" "$GITHUB_WORKSPACE/Code/bot/scripts/smoke.txt" \
                    --server 127.0.0.1:10578 > bot.txt 2>&1 || true
                  cat join.txt bot.txt
                  grep -q "Accepted as player" bot.txt
                  kill "$server"

            - name: Create Linux release archive
              if: ${{ inputs.upload-build-for-next-job || github.ref == 'refs/heads/server' || github.ref == 'refs/heads/test-build' }}
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  # On the server branch: the release it is built from and the fork's commits on top, such as 1.9.7-2-g75ad014.
                  # Upstream's tags were fetched before the build (see above).
                  if [ "$GITHUB_REF" = "refs/heads/server" ] || [ "$GITHUB_REF" = "refs/heads/test-build" ]; then
                    version="$(git describe --tags --match 'v*' 2>/dev/null || git rev-parse --short HEAD)"
                    version="${version#v}"
                  fi
                  echo "ARTIFACT_VERSION=$version" >> "$GITHUB_ENV"
                  mkdir -p release-assets
                  tar -C release-stage -czf \
                    "release-assets/urSovngardeServer-${version}-linux-${{ matrix.arch }}.tar.gz" \
                    .

            - name: Upload the server branch's build
              if: ${{ github.ref == 'refs/heads/server' || github.ref == 'refs/heads/test-build' }}
              uses: actions/upload-artifact@v7
              with:
                  name: urSovngardeServer-${{ env.ARTIFACT_VERSION }}-linux-${{ matrix.arch }}
                  retention-days: 30
                  if-no-files-found: error
                  path: release-assets/urSovngardeServer-${{ env.ARTIFACT_VERSION }}-linux-${{ matrix.arch }}.tar.gz

            # Upload artifacts
            - name: Upload build files for the next job
              if: ${{ inputs.upload-build-for-next-job }}
              uses: actions/upload-artifact@v7
              with:
                  name: release-asset-linux-${{ matrix.arch }}
                  retention-days: 1
                  if-no-files-found: error
                  path: release-assets/urSovngardeServer-${{ env.ARTIFACT_VERSION }}-linux-${{ matrix.arch }}.tar.gz

    # The server branch's build as a release, so that a server can fetch it without a token (an artifact needs one).
    # Its tag is server-<version>; the official releases' v<version> tags (release.yml) are left alone.
    publish-server:
        needs: build
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/server' || github.ref == 'refs/heads/test-build') }}
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  pattern: urSovngardeServer-*
                  merge-multiple: true
                  path: release-assets

            - name: Publish the server build
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  cd release-assets
                  ls -l
                  amd64="$(ls urSovngardeServer-*-linux-amd64.tar.gz)"
                  version="${amd64#urSovngardeServer-}"
                  version="${version%-linux-amd64.tar.gz}"
                  sha256sum urSovngardeServer-*.tar.gz > SHA256SUMS
                  cat SHA256SUMS
                  tag="server-$version"
                  title="Server build $version"
                  notes="The Linux server from this fork's server branch: upstream urSovngarde v${version%%-*} with the fork's server fixes (see the README). Not an official urSovngarde release; players use the official client."
                  prerelease=()
                  # test-build: never server-*, so the VPS updater leaves it alone; a pre-release, as it does not talk to the official client
                  if [ "$GITHUB_REF" = "refs/heads/test-build" ]; then
                    tag="testbuild-server-$version"
                    title="Test build server $version"
                    notes="TEST BUILD from this fork's test-build branch: upstream urSovngarde main after v${version%%-*} (new protocol) with the fork's server fixes. Only the matching testbuild-client release can join it."
                    prerelease=(--prerelease)
                  fi
                  if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    echo "$tag is already published"
                    exit 0
                  fi
                  gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                    --title "$title" --latest=false "${prerelease[@]}" \
                    --notes "$notes" \
                    urSovngardeServer-*.tar.gz SHA256SUMS
