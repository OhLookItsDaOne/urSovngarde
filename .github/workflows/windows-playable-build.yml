name: Playable urSovngarde Build

on:
  workflow_dispatch:
  schedule:
    # Every Friday at 1:00 p.m. UTC
    - cron: '0 13 * * 5'
  # The fork's test client builds. Not "master": xmake.lua builds a master branch as IS_MASTER, without the console,
  # the full crash dumps and some debug tools that the official releases (built from main) have.
  push:
    branches:
      - client
      # The test client for the Testbuild server (upstream main, new protocol), published as testbuild-client-<version>
      - test-build
  workflow_call:

jobs:
  build-windows:
    if: ${{ github.repository_owner == 'tiltedphoques' || github.event_name != 'schedule' }} # Disable cron runs in forks
    uses: ./.github/workflows/windows.yml
    with:
      build-mode: release
      upload-build-for-next-job: true

  # test-build: the client as a pre-release next to testbuild-server-<version> of the same commit (linux.yml).
  # Never marked Latest, so the client-<version> release stays the one people find first.
  publish-test-client:
    needs: build-windows
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/test-build' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish the test client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The build uploads its zips as they are, and download-artifact would unpack them, so each is fetched whole.
          mkdir release-assets
          cd release-assets
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            -q '.artifacts[] | select(.name | test("^urSovngarde-.*-windows-")) | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "${name%.zip}.zip"
            done
          ls -l
          for zip in *.zip; do unzip -tq "$zip"; done
          main="$(ls urSovngarde-*-windows-x64.zip)"
          version="${main#urSovngarde-}"
          version="${version%-windows-x64.zip}"
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS
          tag="testbuild-client-$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published"
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Test build client $version" --latest=false --prerelease \
            --notes "TEST BUILD from this fork's test-build branch: upstream urSovngarde main after v${version%%-*} (new protocol) with the fork's fixes. For the Testbuild server (testbuild-server-$version) only; it cannot join servers on the official release." \
            *.zip SHA256SUMS
