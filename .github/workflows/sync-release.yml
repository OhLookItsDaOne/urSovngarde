name: Sync upstream release into server

# The fork's `server` branch is the latest upstream release plus the fork's Linux OpenSSL 3 fix.
# Every 15 minutes this checks Dosylia/urSovngarde for a new release and merges its tag into `server`.
# The push uses SYNC_TOKEN (a fine-grained token with Contents: write on this fork), because pushes made
# with GITHUB_TOKEN do not start other workflows, and the push must start "Build linux", which publishes
# the server-<version> release. On a merge conflict, or when the fix is gone after the merge, nothing is
# pushed and the run fails, so GitHub mails the owner.
# The newest commit on main must not carry [skip ci]: GitHub then skips the scheduled runs too.

on:
    schedule:
        # Every 15 minutes: GitHub drops most scheduled runs of this fork (on 2026-11-10..12 only one hourly run
        # in seven or eight started), so more slots bring the delay after a release down. Each run takes ~10 s.
        - cron: "7,22,37,52 * * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: sync-release
    cancel-in-progress: false

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Check the token
              env:
                  SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
              run: |
                  if [ -z "$SYNC_TOKEN" ]; then
                      echo "::error::The SYNC_TOKEN secret is missing (Settings > Secrets and variables > Actions)."
                      exit 1
                  fi

            - uses: actions/checkout@v4
              with:
                  ref: server
                  fetch-depth: 0
                  token: ${{ secrets.SYNC_TOKEN }}

            - name: Find the latest upstream release
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tag=$(gh release view -R Dosylia/urSovngarde --json tagName -q .tagName)
                  echo "Latest upstream release: $tag"
                  # Tags stay local to this runner; the fork never gets tags (release.yml would publish them).
                  git fetch --no-tags https://github.com/Dosylia/urSovngarde.git "refs/tags/$tag:refs/tags/$tag"
                  if git merge-base --is-ancestor "$tag" HEAD; then
                      echo "server already contains $tag"
                      echo "merge=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "merge=true" >> "$GITHUB_OUTPUT"
                  fi
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

            - name: Merge the release into server
              if: steps.release.outputs.merge == 'true'
              env:
                  TAG: ${{ steps.release.outputs.tag }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if ! git merge --no-edit -m "Merge tag '$TAG' into server" "$TAG"; then
                      echo "::error::Merging $TAG into server conflicts, merge it by hand:"
                      git diff --name-only --diff-filter=U
                      git merge --abort
                      exit 1
                  fi
                  # The fork's reason to exist: Linux builds GameNetworkingSockets against OpenSSL 3.
                  if ! grep -q '\*\.openssl3' xmake.lua || ! grep -q 'openssl3' xmake-repo/packages/g/gamenetworkingsockets/xmake.lua; then
                      echo "::error::After merging $TAG the OpenSSL 3 fix is gone from xmake.lua or the gamenetworkingsockets recipe, nothing pushed."
                      exit 1
                  fi
                  git push origin HEAD:server
                  echo "Merged $TAG into server, Build linux publishes the server release." >> "$GITHUB_STEP_SUMMARY"
